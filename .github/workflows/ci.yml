name: RedFlag CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install tldextract || echo "tldextract optional"

      - name: Run unit tests (no network)
        run: |
          python -m unittest -v test_redflag_domains

  live-test:
    name: Live network test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tldextract

      - name: Validate REDFLAG_CONTACT secret
        run: |
          if [ -z "${{ secrets.REDFLAG_CONTACT }}" ]; then
            echo "ERROR: REDFLAG_CONTACT secret nije postavljen"
            exit 1
          fi

      - name: Run live tests
        env:
          REDFLAG_LIVE: "1"
          REDFLAG_CONTACT: ${{ secrets.REDFLAG_CONTACT }}
        run: |
          python -m unittest -v test_redflag_domains.LiveTest
